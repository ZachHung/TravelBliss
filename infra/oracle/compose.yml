# The production stack on the VM (ADR 0006), in /opt/travelbliss next to .env.production.
# The deploy sets TAG to the commit to run: TAG=<sha> docker compose --env-file .env.production up -d
# (--env-file fills the ${...} below; env_file passes the same file to the API as its environment)
# Only web is reachable, and only from the VM itself: Tailscale Funnel forwards the public address to it.

# Docker keeps container logs forever by default; the free VM's disk is small
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# The API image and its settings, shared by migrate and api
x-api-image: &api-image
  image: ghcr.io/zachhung/travelbliss-api:${TAG:?set TAG to the commit to run}
  env_file: ${ENV_FILE:-.env.production}
  environment:
    NODE_ENV: production
    API_PORT: 8000
    API_POSTGRES_HOST: db
    API_POSTGRES_PORT: 5432
    API_POSTGRES_SSL: 'false'
    API_REDIS_URI: redis://default:${API_REDIS_PASSWORD}@cache:6379
  logging: *logging

services:
  web:
    image: ghcr.io/zachhung/travelbliss-web:${TAG:?set TAG to the commit to run}
    ports:
      # WEB_BIND only for test-deploy.sh, beside a machine's own :8080
      - ${WEB_BIND:-127.0.0.1:8080}:8080
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

  # The image's migrations (forward only). api waits for them, so it never starts on an unmigrated schema. But `up`
  # replaces api's container before migrate finishes, so a deploy runs `docker compose run --rm migrate` with the new
  # TAG first and only then `up -d`: a failed migration then leaves the running API untouched.
  migrate:
    <<: *api-image
    command:
      ['node', 'node_modules/typeorm/cli.js', '-d', 'dist/config/data-source.js', 'migration:run']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *api-image
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${API_POSTGRES_USER}
      POSTGRES_PASSWORD: ${API_POSTGRES_PASSWORD}
      POSTGRES_DB: ${API_POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped
    logging: *logging

  cache:
    image: redis:7.4.1-alpine
    environment:
      REDIS_PASSWORD: ${API_REDIS_PASSWORD}
    command: /bin/sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep PONG || exit 1']
      interval: 1s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

volumes:
  pg_data:
  redis_data:
