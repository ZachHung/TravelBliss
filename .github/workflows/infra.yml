name: Infra

# Checks for what `pnpm test` doesn't cover: the deploy scripts, Terraform, the VM's compose file, the workflows and
# the agent hooks (ADR 0006). The deploy test runs deploy.sh through every path against a throwaway stack.
on:
  push:
    branches:
      - main
    paths: &paths
      - 'infra/**'
      - '.github/workflows/**'
      - '.claude/hooks/**'
      # deploy-test builds the images it deploys
      - 'apps/*/Dockerfile'
      - 'apps/web/Caddyfile'
  pull_request:
    branches:
      - '**'
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck infra/oracle/*.sh .claude/hooks/*.sh
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: terraform fmt and validate
        run: |
          terraform -chdir=infra/oracle fmt -check -diff
          terraform -chdir=infra/oracle init -backend=false -input=false
          terraform -chdir=infra/oracle validate
      - name: compose config
        # compose.yml refuses unset secrets (:?); dummy values here, and it must fail without them
        run: |
          compose() { docker compose -f infra/oracle/compose.yml --env-file /dev/null config -q; }
          TAG=ci ENV_FILE=/dev/null API_POSTGRES_USER=ci API_POSTGRES_PASSWORD=ci API_POSTGRES_DB=ci \
            API_REDIS_PASSWORD=ci compose
          if TAG=ci ENV_FILE=/dev/null compose 2>/dev/null; then echo 'compose.yml accepted unset secrets' >&2; exit 1; fi
      - name: CI's service images match compose.backing-services.yml
        # Service containers can't extend a compose file (#219), so a Dependabot bump there must reach them too
        run: |
          python3 - <<'EOF'
          import sys, yaml
          shared = "infra/oracle/compose.backing-services.yml"
          pinned = {s["image"] for s in yaml.safe_load(open(shared))["services"].values()}
          jobs = yaml.safe_load(open(".github/workflows/test_pull_request.yml"))["jobs"]
          used = {s["image"] for job in jobs.values() for s in job.get("services", {}).values()}
          if used - pinned:
              sys.exit(f"test_pull_request.yml runs {sorted(used - pinned)}; {shared} pins {sorted(pinned)}")
          EOF
      - name: deploy gate tests
        run: infra/oracle/test-deploy-gate.sh
      - name: ship tests
        run: infra/oracle/test-ship.sh
      - name: hook tests
        run: python3 .claude/hooks/block-env-read.test.py

  deploy-test:
    # On the architecture the VM runs (DEPLOY_ARCH, as in images.yml)
    runs-on: ${{ vars.DEPLOY_ARCH == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v7
      - name: rclone, for the backup checks
        run: sudo apt-get install -y -qq rclone >/dev/null
      # The known-good :main build, from this checkout rather than the last published one, so a change to the images
      # (GET /health, the Caddyfile) is tested before it ships. Reuses images.yml's build cache.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          tags: ghcr.io/zachhung/travelbliss-api:main
          load: true
          cache-from: type=gha,scope=api-${{ vars.DEPLOY_ARCH || 'arm64' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          tags: ghcr.io/zachhung/travelbliss-web:main
          load: true
          cache-from: type=gha,scope=web-${{ vars.DEPLOY_ARCH || 'arm64' }}
      - name: Every deploy.sh and backup.sh path against a throwaway stack
        run: infra/oracle/test-deploy.sh
