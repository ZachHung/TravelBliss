name: Images

# The production images (ADR 0006): built on every PR so a broken Dockerfile fails before merge, and pushed to GHCR
# for each commit on main, tagged with its SHA. The deploy (#180) runs that tag.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  image:
    # Only the VM's architecture: repository variable DEPLOY_ARCH, arm64 (free native ARM runner) unless set to amd64
    runs-on: ${{ vars.DEPLOY_ARCH == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          # :main moves with main, so a rebuilt VM starts the newest version before the next deploy (#178)
          tags: |
            ghcr.io/zachhung/travelbliss-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/zachhung/travelbliss-${{ matrix.app }}:main
          # Links the package to this repo on GHCR
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ vars.DEPLOY_ARCH || 'arm64' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ vars.DEPLOY_ARCH || 'arm64' }}
