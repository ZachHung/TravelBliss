name: Run test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

# Every job only reads the repo; caches and artifacts use the Actions runtime token, not GITHUB_TOKEN
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  test_pull_request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run test
        run: pnpm test
      - name: Check schema.graphql is up to date
        run: git diff --exit-code apps/api/schema.graphql

  # Builds the API image and boots it against real Postgres and Redis: `pnpm test` never touches the Dockerfile
  api_image:
    # The VM's architecture (DEPLOY_ARCH, as in images.yml), so this boots the build that ships and reuses its cache
    runs-on: ${{ vars.DEPLOY_ARCH == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: travelbliss
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d travelbliss" --health-interval 2s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7.4.12-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - id: build
        uses: ./.github/actions/app-image
        with:
          app: api
          tags: ci
          load: true
      - name: Boot it and report healthy
        env:
          IMAGE: ${{ steps.build.outputs.image }}:ci
        run: |
          docker run -d --name api --network host \
            -e NODE_ENV=production -e API_PORT=8000 \
            -e API_POSTGRES_HOST=localhost -e API_POSTGRES_PORT=5432 -e API_POSTGRES_USER=ci \
            -e API_POSTGRES_PASSWORD=ci -e API_POSTGRES_DB=travelbliss -e API_POSTGRES_SSL=false \
            -e API_REDIS_URI=redis://localhost:6379 -e API_SALT_ROUND=4 \
            -e API_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef \
            -e API_SECRET_JWT=ci -e API_JWT_EXPIRED=5m -e API_SECRET_REFRESH=ci -e API_REFRESH_EXPIRED=1d -e API_SESSION_MAX_AGE=7d \
            -e API_COOKIE_NAME=ci -e API_PUBLIC_URL=http://localhost:8000 -e API_CORS_ORIGIN=http://localhost:8000 \
            "$IMAGE"
          timeout 60 sh -c 'until docker logs api 2>&1 | grep -q "Server running"; do sleep 1; done' || { docker logs api; exit 1; }
          curl -sf localhost:8000/health | jq -e '.status == "pass"' >/dev/null || { curl -s localhost:8000/health; docker logs api; exit 1; }

  # Drives a real browser through register / sign in / reload / sign out against the throwaway e2e stack
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @travelbliss/web exec playwright install --with-deps chromium
      - name: Run e2e
        run: pnpm e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
