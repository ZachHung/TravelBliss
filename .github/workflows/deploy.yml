name: Deploy

# Deploys main to production (ADR 0006, #180) once "Run test", "Images" and, when it ran, "Infra" passed for the same
# commit. Each triggers this when it completes; any that finishes first finds another still running and stops.
on:
  workflow_run:
    # By `name:`, as workflow_run requires. deploy-gate.sh checks the same ones by file; its test fails if they drift.
    workflows: ['Run test', 'Images', 'Infra']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

# One deploy at a time. A newer commit waits for the running one instead of cancelling it half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ready.outputs.sha }}
    steps:
      # The gate script from main's tip, which is this commit whenever it can deploy
      - uses: actions/checkout@v7
      - name: Is this commit ready, and still the newest on main?
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        # Prints the sha only when it should deploy; its rules and their tests: infra/oracle/deploy-gate.sh (#216)
        # Two lines: inside echo's argument, a failing gate (an API error) wouldn't fail the step
        run: |
          sha=$(infra/oracle/deploy-gate.sh "$SHA" "$GITHUB_EVENT_NAME")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.sha != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}

      # An ephemeral tag:ci node: the tailnet policy lets it reach only tag:travelbliss, over SSH (#183)
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: travelbliss

      - name: Deploy ${{ needs.check.outputs.sha }}
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          ssh_vm() { ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 root@travelbliss "$@"; }
          # The VM keeps no copy of the repo: the files in infra/oracle/vm-files.txt travel with each deploy
          infra/oracle/ship.sh root@travelbliss
          # A manual run redeploys even an already-live commit: that's what it's for
          force=$([ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && echo --force || true)
          ssh_vm "/opt/travelbliss/deploy.sh $SHA $force"
          echo "Deployed \`$SHA\` to ${{ vars.SITE_URL }}" >> "$GITHUB_STEP_SUMMARY"
