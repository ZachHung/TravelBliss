name: Deploy

# Deploys main to production (ADR 0006, #180) once "Run test", "Images" and, when it ran, "Infra" passed for the same
# commit. Each triggers this when it completes; any that finishes first finds another still running and stops.
on:
  workflow_run:
    # By `name:`, as workflow_run requires. The same ones are checked by file in the check job: change both together.
    workflows: ['Run test', 'Images', 'Infra']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

# One deploy at a time. A newer commit waits for the running one instead of cancelling it half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ready.outputs.sha }}
    steps:
      - name: Is this commit ready, and still the newest on main?
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$SHA" != "$main" ]; then
            echo "Skip: $SHA is no longer the tip of main ($main); its own run deploys that one."; exit 0
          fi
          for wf in test_pull_request.yml images.yml infra.yml; do # the workflows in on.workflow_run
            result=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --commit "$SHA" --event push --limit 1 \
              --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"')
            # Infra runs only for a push touching its paths, and a push creates all its runs at once: none means
            # nothing of the deploy scripts changed (#213)
            if [ "$wf" = infra.yml ] && [ "$result" = null/null ]; then
              continue
            fi
            case $result in
              completed/success) ;;
              completed/*) echo "Skip: $wf is $result for $SHA; not deploying it. Fix and push, or rerun $wf."; exit 0 ;;
              *) echo "Skip: $wf is $result for $SHA; its completion triggers this again."; exit 0 ;;
            esac
          done
          # Both triggers usually find the commit ready. The second run starts once the first has finished (the
          # concurrency group), so a successful deployment of it is already recorded: skip instead of recording
          # another. A failed deploy has no success status, so it can be retried. A manual run always deploys
          # (e.g. after the VM was rebuilt, or its compose or env changed), so it skips this check.
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&sha=$SHA" --jq '.[].id'); do
              if gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[].state' | grep -qx success; then
                echo "Skip: $SHA is already deployed to production. To redeploy it, run this workflow manually."
                exit 0
              fi
            done
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.sha != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}

      # An ephemeral tag:ci node: the tailnet policy lets it reach only tag:travelbliss, over SSH (#183)
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: travelbliss

      - name: Deploy ${{ needs.check.outputs.sha }}
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          ssh_vm() { ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 root@travelbliss "$@"; }
          # The VM keeps no copy of the repo: compose.yml and the scripts travel with each deploy
          ssh_vm 'cat > /opt/travelbliss/compose.yml' < infra/oracle/compose.yml
          ssh_vm 'cat > /opt/travelbliss/deploy.sh && chmod 755 /opt/travelbliss/deploy.sh' < infra/oracle/deploy.sh
          ssh_vm 'cat > /opt/travelbliss/backup.sh && chmod 755 /opt/travelbliss/backup.sh' < infra/oracle/backup.sh
          # A manual run redeploys even an already-live commit: that's what it's for
          force=$([ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && echo --force || true)
          ssh_vm "/opt/travelbliss/deploy.sh $SHA $force"
          echo "Deployed \`$SHA\` to ${{ vars.SITE_URL }}" >> "$GITHUB_STEP_SUMMARY"
