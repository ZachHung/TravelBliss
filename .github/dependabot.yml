version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Majors stay out of groups so each arrives as its own PR, titled with the version jump
    groups:
      mantine:
        patterns:
          - '@mantine/*'
          - 'postcss-preset-mantine'
          - 'mantine-form-zod-resolver'
        update-types: ['minor', 'patch']
      eslint:
        patterns:
          - '*eslint*'
        update-types: ['minor', 'patch']
      storybook:
        patterns:
          - '@storybook/*'
          - '@chromatic-com/storybook'
          - 'storybook'
          - 'storybook-dark-mode'
        update-types: ['minor', 'patch']
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types: ['minor', 'patch']
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types: ['minor', 'patch']
      graphql:
        patterns:
          - '@graphql-codegen/*'
          - 'graphql'
          - '@graphql-typed-document-node/*'
        update-types: ['minor', 'patch']
    ignore:
      # type-graphql's peer dependency is graphql ^16; remove once it supports 17 (#133)
      - dependency-name: 'graphql'
        versions: ['>=17']
      # type-graphql's peer dependency is graphql-scalars ^1.25; remove with the one above (#133)
      - dependency-name: 'graphql-scalars'
        versions: ['>=2']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
