version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # At most two npm version-update PRs a week (GitHub Actions adds a third). Majors get their own group so they
    # can't hide among safe updates, and a failing major doesn't hold back minor and patch updates. Related majors
    # (e.g. stylelint and its config) arrive in the same PR. Majors do wait on each other: when one breaks CI,
    # comment `@dependabot ignore <name> major version` on the PR and the next run rebuilds it without that one.
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      npm-major:
        patterns: ['*']
        update-types: ['major']
      # Security fixes come as soon as an alert opens, not weekly; this batches the alerts open at the time
      # into one PR.
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # type-graphql's peer dependency is graphql ^16; remove once it supports 17 (#133).
      # Majors only: apps/web is already on 17 and should keep getting its minor and patch updates.
      - dependency-name: 'graphql'
        update-types: ['version-update:semver-major']
      # typescript-eslint and ts-node don't run on TypeScript 7 yet (#164)
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Follows the Node runtime (.nvmrc, Dockerfile), not npm: bump its major together with Node
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  # The image pins, by hand until now (#219): Postgres and Redis in one file, plus the apps' base images. A bump to
  # backing-services.yml must also reach test_pull_request.yml's service containers; Infra fails the PR until it does.
  - package-ecosystem: 'docker-compose'
    directory: '/infra/oracle'
    schedule:
      interval: 'weekly'
    groups:
      backing-services:
        patterns: ['*']
  - package-ecosystem: 'docker'
    directories: ['/apps/api', '/apps/web']
    schedule:
      interval: 'weekly'
    groups:
      base-images:
        patterns: ['*']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # Majors included on purpose, unlike npm: action majors are mostly Node runtime bumps, and one PR a week
      # beats a separate majors PR. If one breaks CI, `@dependabot ignore <name> major version` drops it.
      github-actions:
        patterns: ['*']
