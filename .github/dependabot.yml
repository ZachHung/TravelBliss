version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      mantine:
        patterns:
          - '@mantine/*'
          - 'postcss-preset-mantine'
          - 'mantine-form-zod-resolver'
      eslint:
        patterns:
          - '*eslint*'
      storybook:
        patterns:
          - '@storybook/*'
          - '@chromatic-com/storybook'
          - 'storybook'
          - 'storybook-dark-mode'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      graphql:
        patterns:
          - '@graphql-codegen/*'
          - 'graphql'
          - '@graphql-typed-document-node/*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
