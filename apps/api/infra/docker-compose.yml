# Env comes from the repo root .env.local. From apps/api:
#   pnpm docker:local:up   Postgres + Redis only (what `pnpm dev:local` uses)
#   pnpm docker:serve:up   the same plus the API image (`serve` profile)
# `pnpm e2e` runs a second copy from .env.e2e: its own project (COMPOSE_PROJECT_NAME) and host ports
volumes:
  redis_data:
    driver: local
  pg_data:
    driver: local

services:
  app:
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    profiles: [serve]
    env_file:
      - ../../../.env.local
    environment:
      NODE_ENV: local
      # Inside the compose network the services are reached by name, not localhost
      API_POSTGRES_HOST: db
      API_REDIS_URI: redis://default:${API_REDIS_PASSWORD}@cache:6379
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  db:
    extends: { file: ../../../infra/oracle/backing-services.yml, service: db }
    ports:
      - ${API_POSTGRES_PORT:-5432}:5432

  cache:
    extends: { file: ../../../infra/oracle/backing-services.yml, service: cache }
    ports:
      - '${API_REDIS_PORT:-6379}:6379'
