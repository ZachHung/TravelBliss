packages:
  - apps/*

# Packages whose install scripts may run (pnpm 11+ fails an install on any other package that has one). Was
# package.json's pnpm.onlyBuiltDependencies, which pnpm 11 no longer reads.
allowBuilds:
  '@swc/core': true
  'bcrypt': true
  'esbuild': true
  # Its postinstall only warns about TypeScript; pnpm 10 never ran it either
  '@apollo/protobufjs': false

# Agent skills a dependency ships (pnpm 12): pnpm links approved ones into agent skill folders. None approved here;
# this repo's agent setup is chosen by hand (.claude/), not by what a dependency publishes.
permissions:
  '@apollo/client':
    skills: false

# One version for a dependency both apps use: they write `catalog:` instead of a range, so a bump is one line here.
# graphql stays per app on purpose: the API waits on type-graphql for 17 (#133).
# strict: `pnpm add` of a dependency the catalog lists writes `catalog:`, never a second range
catalogMode: strict
catalog:
  'vitest': ^5.1.1
  '@vitest/coverage-v8': ^5.1.1
  'vite': ^8.3.8
  'dayjs': ^1.11.23
  'zod': ^4.6.7

# Peer ranges this repo knowingly runs ahead of, so `pnpm peers check` (in `pnpm test`) flags only new drift. Each
# was taken on purpose and runs here: lint, the API tests and e2e pass on these versions.
peerDependencyRules:
  allowedVersions:
    # graphql-scalars 2.0.1 for the PhoneNumber ReDoS fix; type-graphql still declares ^1 (#189, #133)
    'type-graphql>graphql-scalars': '2'
    # ioredis 6 (#168); typeorm declares ^5 for its optional Redis cache, which the API doesn't use
    'typeorm>ioredis': '6'
    # ESLint 10; these configs and plugins still declare ^9
    'eslint-config-mantine>eslint': '10'
    'eslint-config-mantine>@eslint/js': '10'
    'eslint-plugin-jsx-a11y>eslint': '10'
    'eslint-plugin-react>eslint': '10'

# Each checkout's node_modules links into one shared store (~/.pnpm/store) instead of holding copies: about 5 MB
# instead of 695 MB, so a new worktree installs in seconds.
enableGlobalVirtualStore: true

# Dependencies these packages use without declaring them. From the shared store, unlike a project's own
# node_modules/.pnpm, nothing undeclared is reachable, so each is declared here. A new "cannot resolve" or
# implicit-any from inside a dependency is the same gap: add it here. Remove one once its package declares it.
packageExtensions:
  # Its index.d.ts imports WithRequired from here without listing it (types only)
  '@as-integrations/express5':
    dependencies:
      '@apollo/utils.withrequired': ^3.0.0
  # Its ESM build imports react-dom (useCollapse) but lists only react as a peer
  '@mantine/hooks':
    peerDependencies:
      react-dom: '*'
  # Its React components' types need @types/react, which it doesn't list beside its react peer
  '@apollo/client':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
